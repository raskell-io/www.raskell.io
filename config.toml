Raskell is my corner of the web and the front door to everything I build.
I write here about platform automation, edge systems, applied security, and
what changes when AI writes most of the code.

The projects that fascinate me, from a security-first reverse proxy to Haskell
tooling written in Rust, start as notes on these pages before they become real
things. The name is rascal × Haskell × Raffael.
"""
