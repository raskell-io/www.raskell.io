base_url = "https://raskell.io"
title = "Raskell"
description = "Writing about platform automation, edge systems, applied security, and open standards. Building automation-first platforms that survive production reality."
default_language = "en"
theme = "seijaku"
compile_sass = true
minify_html = true
generate_feeds = true
feed_filenames = ["rss.xml"]
build_search_index = true

taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true },
    { name = "series", feed = true },
]

[markdown]
smart_punctuation = true
render_emoji = false
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = false
insert_anchor_links = "none"
highlighting = { enabled = true, theme = "nord" }

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[search]
include_title = true
include_description = true
include_path = true
include_content = true

[extra]
author = "Raffael"
twitter_handle = "raskelll"
keywords = "platform automation, edge systems, applied security, open standards, Rust, DevOps, infrastructure"

[extra.seijaku]
version = "aw26"
tagline = "(tech web space curated by Raffael)"
footer_note = "made in Basel with 静寂"
footer_about = """
Raskell is my corner of the web and the front door to everything I build.
I write here about platform automation, edge systems, applied security, and
what changes when AI writes most of the code.

The projects that fascinate me, from a security-first reverse proxy to Haskell
tooling written in Rust, start as notes on these pages before they become real
things. The name is rascal × Haskell × Raffael.
"""
og_image = "og-default.png"
scheme_toggle = true
code_copy = true
portrait = "images/raffael.webp"
hero_motion = "images/raskell-hero.avif"
hero_poster = "images/raskell-hero.webp"
mark = "images/raskell-mark.svg"
mark_play = true
main_section = "articles"
projects_section = "projects"
cta = { name = "Start here", url = "@/start-here.md" }
nav = [
  { name = "Articles", url = "@/articles/_index.md" },
  { name = "Projects", url = "@/projects/_index.md" },
  { name = "Speaking", url = "@/speaking.md" },
  { name = "About", url = "@/about.md" },
]
explore = [
  { name = "Tags", url = "/tags" },
  { name = "Categories", url = "/categories" },
  { name = "Series", url = "/series" },
  { name = "RSS", url = "/rss.xml" },
]
social = [
  { name = "GitHub", url = "https://github.com/raffaelschneider" },
