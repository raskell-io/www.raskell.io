name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  # Monthly rebuild, so generated files with dates (security.txt Expires) never go stale.
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Check tags against the vocabulary
        run: mise run tags-check

      - name: Generate security.txt
        run: mise run security-txt

      - name: Generate llms.txt, Markdown copies, and reading.json
        run: mise run llms

      - name: Generate the topic pages of every translated language
        run: mise run topic-pages

      - name: Build
        run: zola build

      - name: Publish map.json
        run: mise run map-json

      - name: Publish garden.json and links.json
        run: mise run garden-json

      # Social cards are drawn only when their content changed: the cache holds last run's cards by fingerprint
      # (see .mise/tasks/og). A new key each run saves the fresh set; restore-keys picks up the latest one.
      - name: Restore the social card cache
        uses: actions/cache@v4
        with:
          path: .og-cache
          key: og-cards-${{ github.run_id }}
          restore-keys: og-cards-

      # Chinese and Korean cards need CJK fonts, which the runner lacks. Only when they are switched on
      # (extra.seijaku.og_cards_translated in config.toml).
      - name: Install CJK fonts for translated social cards
        run: |
          if grep -qE '^og_cards_translated\s*=\s*true' config.toml; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          fi

      - name: Draw social cards
        run: mise run og
        env:
          OG_CACHE: ${{ github.workspace }}/.og-cache

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Notify IndexNow
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: mise run indexnow
