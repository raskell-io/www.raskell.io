name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Download fonts
        run: mise run download-fonts

      - name: Check tags against the vocabulary
        run: mise run tags-check

      - name: Generate llms.txt and Markdown copies
        run: mise run llms

      - name: Build
        run: zola build

      - name: Publish map.json
        run: mise run map-json

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Notify IndexNow
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: mise run indexnow
