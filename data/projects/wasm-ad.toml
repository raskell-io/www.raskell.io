title = "WASM-AD"
description = "A fantasy console standard with 32-bit handheld hardware: tile layers, sprites, palettes, and save RAM, memory-mapped inside the cartridge. A cartridge is a single WebAssembly module. Comes with a written spec, a reference renderer with conformance tests, a Rust SDK, and a web player."
