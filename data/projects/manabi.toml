title = "Manabi"
description = "A reading-first language-learning app for Chinese, Japanese, Korean, and Hebrew. It trains recognition, pronunciation, listening, context, and recall separately, with spaced repetition and prerecorded native audio. It runs offline in the browser and installs as a PWA."
status = "live"
logo = "brands/manabi.png"
links = [ { name = "Open app", url = "https://manabi.raskell.io" }, { name = "GitHub", url = "https://github.com/raskell-io/manabi" } ]
topics = ["local-first", "data-sovereignty", "typescript", "languages", "china"]

app_category = "EducationalApplication"   # schema.org applicationCategory (default DeveloperApplication)

# Translations: any field here replaces the original in that language (description, title, tagline).
[i18n.zh]
description = "一个以阅读为先的语言学习应用，支持中文、日语、韩语和希伯来语。它分别训练识别、发音、听力、语境和回忆，配合间隔重复和预先录制的母语音频。它在浏览器中离线运行，可以作为 PWA 安装。"

[i18n.ko]
description = "중국어, 일본어, 한국어, 히브리어를 위한 읽기 중심의 언어 학습 앱입니다. 인식, 발음, 듣기, 맥락, 회상을 따로 훈련하며, 간격 반복과 미리 녹음한 원어민 음성을 사용합니다. 브라우저에서 오프라인으로 실행되고 PWA로 설치할 수 있습니다."
