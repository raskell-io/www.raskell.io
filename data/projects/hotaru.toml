title = "Hotaru"
description = "Simulated neuron cultures on a 60-electrode array play Pong in your browser, as in the DishBrain experiment. One culture gets feedback for its hits and misses, an identical one gets it at random. So far the feedback has not made them reliably better, and the page shows the numbers."
