[i18n.zh]
description = "《星际争霸：母巢之战》竞技圈的社区平台，相当于母巢之战版的 basketball-reference.com。150 位职业选手的英文和韩文资料，每种对局的建造顺序、赛事、维基，以及在浏览器中用 WebAssembly 运行的录像分析，什么都不用上传。"

