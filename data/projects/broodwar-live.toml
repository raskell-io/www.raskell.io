description = "스타크래프트: 브루드 워 경쟁 플레이를 위한 커뮤니티 플랫폼으로, 브루드 워판 basketball-reference.com입니다. 영어와 한국어로 된 프로게이머 150명의 프로필, 모든 종족전의 빌드 오더, 대회, 위키, 그리고 브라우저에서 WebAssembly로 실행되어 아무것도 업로드하지 않는 리플레이 분석을 제공합니다."
