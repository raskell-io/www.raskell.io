title = "Chronicle of Earth"
logo = "brands/chronicle-of-earth.svg"
logo_dark = "brands/chronicle-of-earth-dark.svg"
wordmark = "brands/chronicle-of-earth-wordmark-light.svg"   # the brandtype, shown beside the logo as the card title
wordmark_dark = "brands/chronicle-of-earth-wordmark-dark.svg"
description = "An evidence-linked historical atlas, starting with 1900–2026: choose a place and a date, see what changed, and inspect the evidence behind every assertion. Control, territorial claims and recognition stay separate, disagreement is preserved, and coverage gaps are shown as gaps. The website's globe travels through the record, showing how far each entry has been verified. An early prototype zooms from globe to village; every historical record is still an unreviewed draft."
status = "dev"
status_label = "Early prototype, website preview"
links = [ { name = "Website preview", url = "https://chronicle-of-earth.github.io/" }, { name = "Method", url = "https://chronicle-of-earth.github.io/method/" }, { name = "GitHub", url = "https://github.com/chronicle-of-earth" } ]
topics = ["history", "geopolitics", "geography", "provenance", "legibility", "knowledge-management", "typescript"]
stack = ["SvelteKit", "TypeScript", "MapLibre", "Zola"]
related = ["human-macroscope"]
accents = ["#a8823a", "#d2b26c"]   # brand colours (brass), used for the card glow

app_category = "EducationalApplication"   # schema.org applicationCategory (default DeveloperApplication)

# Translations: any field here replaces the original in that language (description, title, tagline).
[i18n.zh]
description = "一部以证据为基础的历史地图集，从 1900 年到 2026 年开始：选择一个地点和一个日期，看看发生了什么变化，并查看每一项论断背后的证据。实际控制、领土主张和外交承认分开记录，分歧被保留下来，覆盖空白就以空白呈现。网站上的地球会依次走过记录中的每一条，显示每条记录已经核实到哪一步。早期原型可以从整个地球放大到村庄；所有历史记录目前都还是未经审核的草稿。"

[i18n.ko]
description = "근거에 연결된 역사 지도책으로, 1900년부터 2026년까지에서 시작합니다. 장소와 날짜를 고르면 무엇이 바뀌었는지 보고, 모든 주장 뒤에 있는 근거를 살펴볼 수 있습니다. 실효 지배, 영토 주장, 국가 승인은 따로 기록하고, 견해 차이는 그대로 보존하며, 다루지 못한 공백은 공백으로 보여 줍니다. 웹사이트의 지구본은 기록을 하나씩 따라가며 각 항목이 어디까지 검증되었는지 보여 줍니다. 초기 프로토타입은 지구 전체에서 마을까지 확대되며, 모든 역사 기록은 아직 검토되지 않은 초안입니다."
