title = "Cyanea"
description = "Bioinformatics notebooks that actually re-run. Write, run, and share analyses that execute in your browser on WebAssembly, with nothing to install. Every notebook, dataset, and output is a versioned snapshot you can run again. A Rust analysis stack underneath, 21 file formats built in. Open source, with self-hosting and federation on the way."
status = "live"
status_label = "Public alpha"
logo = "brands/cyanea.svg"
logo_dark = "brands/cyanea-dark.svg"
wordmark = "brands/cyanea-wordmark-light.svg"   # the brandtype, shown beside the logo as the card title
wordmark_dark = "brands/cyanea-wordmark-dark.svg"
featured = true
links = [ { name = "Website", url = "https://cyanea.bio" }, { name = "Docs", url = "https://docs.cyanea.bio" }, { name = "GitHub", url = "https://github.com/cyanea-bio" } ]
pitch = "@/pitch/cyanea.md"   # investor brief, linked from /invest/
topics = ["oss", "rust", "webassembly", "self-hosting", "life-sciences", "synthetic-biology"]
accents = ["#B9A6FF", "#8BE4F5"]   # brand colours (lavender, jelly cyan), used for the card glow

app_category = "ScientificApplication"   # schema.org applicationCategory (default DeveloperApplication)

# Translations: any field here replaces the original in that language (description, title, tagline).
[i18n.zh]
description = "真正能重新运行的生物信息学笔记本。编写、运行并分享在浏览器中用 WebAssembly 执行的分析，无需安装任何东西。每个笔记本、数据集和输出都是一个可以再次运行的版本化快照。底层是 Rust 分析栈，内置 21 种文件格式。开源，自托管和联邦功能即将推出。"

[i18n.ko]
description = "정말로 다시 실행되는 생물정보학 노트북입니다. 브라우저에서 WebAssembly로 실행되는 분석을 아무것도 설치하지 않고 작성하고, 실행하고, 공유할 수 있습니다. 모든 노트북, 데이터셋, 출력은 다시 실행할 수 있는 버전 관리된 스냅샷입니다. 그 아래에는 Rust 분석 스택이 있고, 21가지 파일 형식이 내장되어 있습니다. 오픈 소스이며, 셀프 호스팅과 연합 기능이 준비 중입니다."
