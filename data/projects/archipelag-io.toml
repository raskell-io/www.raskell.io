title = "Archipelag.io"
description = "Decentralized AI compute: AI jobs run on a network of community-operated GPU hosts. Jobs prefer nearby hosts and a preferred region, and every job records where it ran; strict regional enforcement is in development. In free open beta: hosts earn virtual credits while metering is validated, and real-money payouts are not enabled yet."
