title = "Conflux"
description = "Schema-aware config state coordination. Multiple writers, deterministic merge, git milestones. A CRDT document engine with pluggable storage backends (SQLite, PostgreSQL, DynamoDB)."
status = "dev"
links = [ { name = "GitHub", url = "https://github.com/raskell-io/conflux" } ]
topics = ["distributed-systems", "local-first", "rust"]

