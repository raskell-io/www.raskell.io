title = "Paw & Claw"
description = "A turn-based strategy game in the spirit of Advance Wars, fought by woodland armies. Raccoons, badgers, lions, red pandas, and moles fight over every thicket and creek. Built in Rust with Bevy. Play it free in the browser, or as a desktop build."
status = "live"
status_label = "Playable"
logo = "brands/paw-and-claw.png"
links = [ { name = "Play", url = "https://pawandclaw.raskell.io" }, { name = "GitHub", url = "https://github.com/raskell-io/paw-and-claw" } ]
topics = ["games", "rust"]

# Translations: any field here replaces the original in that language (description, title, tagline).
[i18n.zh]
description = "一款继承《高级战争》精神的回合制策略游戏，交战双方是林地里的军队。浣熊、獾、狮子、小熊猫和鼹鼠争夺每一片灌木丛和每一条小溪。用 Rust 和 Bevy 构建。可以在浏览器里免费玩，也有桌面版。"

[i18n.ko]
description = "어드밴스 워즈의 정신을 이은 턴제 전략 게임으로, 숲속 군대들이 싸웁니다. 너구리, 오소리, 사자, 레서판다, 두더지가 모든 덤불과 개울을 두고 다툽니다. Rust와 Bevy로 만들었습니다. 브라우저에서 무료로 하거나 데스크톱 빌드로 즐길 수 있습니다."
