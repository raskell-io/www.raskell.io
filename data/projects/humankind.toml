title = "Humankind"
description = "Human continuity platform for preserving presence across generations. Humankind helps people build a living archive of voice, stories, memories, values, and relational warmth so the texture of a person remains accessible long after distance, aging, or death would otherwise erase it. Consent-first, privacy by default, and explicit about the difference between recorded truth, reconstruction, and inference."
