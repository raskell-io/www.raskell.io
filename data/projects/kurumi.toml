title = "Kurumi"
description = "A local-first, AI-native second brain. Capture notes, links, and meetings, then find them again through wikilinks, backlinks, a graph view, and full-text search. Everything works offline, with optional sync through Automerge CRDTs and no vendor lock-in."
status = "live"
logo = "brands/kurumi.png"
links = [ { name = "Open app", url = "https://kurumi.raskell.io" }, { name = "GitHub", url = "https://github.com/raskell-io/kurumi" } ]
topics = ["local-first", "data-sovereignty", "knowledge-management", "distributed-systems", "typescript", "external-memory"]

# Translations: any field here replaces the original in that language (description, title, tagline).
[i18n.zh]
description = "一个本地优先、AI 原生的第二大脑。记录笔记、链接和会议，再通过维基链接、反向链接、图谱视图和全文搜索把它们找回来。一切都能离线使用，可选通过 Automerge CRDT 同步，没有厂商锁定。"

[i18n.ko]
description = "로컬 우선, AI 네이티브 세컨드 브레인입니다. 노트, 링크, 회의를 기록하고, 위키링크, 백링크, 그래프 보기, 전문 검색으로 다시 찾을 수 있습니다. 모든 기능이 오프라인에서 동작하며, Automerge CRDT를 통한 선택적 동기화를 지원하고, 벤더 종속이 없습니다."
