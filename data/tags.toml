# The topic vocabulary of raskell.io: one entry per tag slug used in content/ and data/projects/.
# This is the backbone of the knowledge graph on /map/, the tag pages, and llms.txt.
#
#   name         how the tag is shown
#   kind         domain (a field of work), concept (an idea that cuts across fields),
#                technology (a language, tool, or platform), or site (about raskell.io itself)
#   description  one sentence, what the tag means here
#   broader      parent tags; drawn as edges on the map, so the vocabulary is a graph, not a list
#
# Adding a tag: add an entry here first, then use the slug. `mise run tags-check` reports tags used
# in content that are missing here, and entries nothing uses yet.

# Domains ------------------------------------------------------------------

[ai-platforms]
name = "AI platforms"
kind = "domain"
description = "The shared foundation an organisation builds AI on: model gateways, agent runtimes, governance, observability, and the operating model around them."

[ai-engineering]
name = "AI-assisted engineering"
kind = "domain"
description = "AI as an engineering tool: coding agents, AI-authored code, and what programming becomes when models write most of it."

[ai-for-ops]
name = "AI for operations"
kind = "domain"
description = "AI applied to running systems: security triage, alert noise, incident work, and keeping a human in the loop."

[platform-automation]
name = "Platform automation"
kind = "domain"
description = "Self-service, guardrails, deployment, and the tooling that keeps operating software sustainable."

[edge-systems]
name = "Edge systems"
kind = "domain"
description = "Reverse proxies, policy enforcement, CDNs, and logic that runs close to the user instead of in the backend."

[applied-security]
name = "Applied security"
kind = "domain"
description = "Security under production pressure: adversarial input, signal versus noise, and controls that operators can live with."

[distributed-systems]
name = "Distributed systems"
kind = "domain"
description = "Replication, coordination, and consistency across machines that fail independently."

[programming-languages]
name = "Programming languages"
kind = "domain"
description = "Languages, type systems, compilers, and how executable intent gets written down."

[operating-systems]
name = "Operating systems"
kind = "domain"
description = "Kernels, virtualisation, and the layer between hardware and everything else, from BSD to inference-native designs."

[reliability]
name = "Reliability"
kind = "domain"
description = "Failure modes, operability, and keeping systems up when the inputs and the dependencies misbehave."

[sovereignty]
name = "Sovereignty"
kind = "domain"
description = "Who controls compute, data, and infrastructure, and in which jurisdiction; Europe's position in particular."

[policy]
name = "Policy"
kind = "domain"
description = "Where engineering meets regulation, public institutions, procurement, and national strategy."

[open-web]
name = "The open web"
kind = "domain"
description = "The web as a commons: open protocols, small independent sites, and publishing outside the platforms."

[history]
name = "History"
kind = "domain"
description = "Events, institutions, and societies through time, with attention to sources, competing accounts, and uncertainty."

[geography]
name = "Geography"
kind = "domain"
description = "Places, terrain, borders, and spatial data, and how their relationships change over time."

[machine-learning]
name = "Machine learning"
kind = "domain"
description = "How models learn from data: the mathematics, the training methods, and what the results can and cannot do."

[life-sciences]
name = "Life sciences"
kind = "domain"
description = "Biology and medicine: how living systems work, and how we learn to measure, model, and treat them."

[philosophy]
name = "Philosophy"
kind = "domain"
description = "Questions about knowledge, mind, morality, and belief, from how science knows things to the novels that argue with God."

[literature]
name = "Literature"
kind = "domain"
description = "Fiction and writing about fiction: novels read for their own sake, and the forms they take."

[mathematics]
name = "Mathematics"
kind = "domain"
description = "The mathematics underneath the systems on this site: probability, linear algebra, optimisation, and proof."

[game-ai]
name = "Game AI"
kind = "domain"
description = "Programs that play games: search, evaluation, learned networks, and how their strength is measured, from chess engines to Go and real-time strategy."
broader = ["machine-learning", "games"]

# Concepts -----------------------------------------------------------------

[agents]
name = "Agents"
kind = "concept"
description = "LLM agents as software: the loop, tools, context, memory, sandboxes, and the platform underneath them."
broader = ["ai-platforms"]

[context-engineering]
name = "Context engineering"
kind = "concept"
description = "Deciding what a model sees: pinned context, retrieval, memory, and the conventions that keep them honest."
broader = ["agents"]

[inference]
name = "Inference"
kind = "concept"
description = "Running models in production: routing, cost, hardware, and inference as a metered utility."
broader = ["ai-platforms"]

[isolation]
name = "Isolation"
kind = "concept"
description = "Sandboxes, process and failure-domain isolation, and running untrusted or fallible work safely."
broader = ["applied-security", "reliability"]

[waf]
name = "WAF and traffic inspection"
kind = "concept"
description = "Web application firewalls, rule tuning, traffic replay, and inspecting requests without drowning operators."
broader = ["applied-security", "edge-systems"]

[observability]
name = "Observability"
kind = "concept"
description = "Seeing what a running system does: traces, metering, glass-box infrastructure, and what not to log."
broader = ["reliability"]

[economics]
name = "Economics"
kind = "concept"
description = "Cost, pricing, budgets, and the money side of infrastructure, inference, and innovation."

[evaluation]
name = "Evaluation"
kind = "concept"
description = "Measuring whether an AI system does the right thing: golden sets, structural checks, LLM-as-judge, and regression suites."
broader = ["agents", "metrics"]

[metrics]
name = "Metrics"
kind = "concept"
description = "What to measure, leading versus lagging signals, and vanity numbers that look like insight."

[formal-methods]
name = "Formal methods"
kind = "concept"
description = "Proofs, verification, and types as specifications, especially once machines write the code."
broader = ["programming-languages"]

[developer-tooling]
name = "Developer tooling"
kind = "concept"
description = "Package managers, build tools, CLIs, and the daily toolchain an engineer actually touches."
broader = ["platform-automation"]

[self-hosting]
name = "Self-hosting"
kind = "concept"
description = "Running your own infrastructure, from a single bare-metal box to community-operated compute."
broader = ["platform-automation", "sovereignty"]

[complex-systems]
name = "Complex systems"
kind = "concept"
description = "Emergence and collective dynamics: how simple agents, roles, and rules add up to markets, institutions, and societies."

[reinforcement-learning]
name = "Reinforcement learning"
kind = "concept"
description = "Learning from the outcomes of one's own actions: self-play, rewards, and feedback loops that turn experience into skill."
broader = ["machine-learning"]

[self-play]
name = "Self-play"
kind = "concept"
description = "A program improving by playing itself: generating its own training data, learning from the outcomes, and testing each generation against the last."
broader = ["reinforcement-learning", "game-ai"]

[tree-search]
name = "Tree search"
kind = "concept"
description = "Looking ahead by expanding a tree of moves: minimax and alpha-beta, Monte Carlo tree search, and the pruning and ordering that make them tractable."
broader = ["game-ai"]

[neural-networks]
name = "Neural networks"
kind = "concept"
description = "Layers of weights that learn a function from examples: architectures, activations, quantisation, and running them where the data is."
broader = ["machine-learning"]

[neuroscience]
name = "Neuroscience"
kind = "concept"
description = "Brains and nervous systems: connectomes, neural recording, and the attempt to model what neurons compute."
broader = ["life-sciences"]

[history-of-science]
name = "History of science"
kind = "concept"
description = "How discoveries were actually made: the people, instruments, dead ends, and institutions behind them."
broader = ["history"]

[history-of-technology]
name = "History of technology"
kind = "concept"
description = "How tools, machines, and networks came to be built, and the choices that shaped them."
broader = ["history"]

[local-first]
name = "Local-first"
kind = "concept"
description = "Software that keeps data on your devices and syncs through CRDTs, with the network as an optimisation."
broader = ["distributed-systems"]

[knowledge-management]
name = "Knowledge management"
kind = "concept"
description = "Second brains, knowledge graphs, and how notes, links, and memory turn into understanding."

[simulation]
name = "Simulation"
kind = "domain"
description = "Interactive worlds that mimic real ones: societies, economies, neuron cultures, and agents left to evolve on their own."
broader = ["complex-systems"]

[games]
name = "Games"
kind = "domain"
description = "Games made with care: tactics, fishing, and the engines and fantasy consoles they run on."

[oss]
name = "Open source"
kind = "concept"
description = "Open source as the point of the work, not just its licence."
broader = ["open-web"]

[hypertext]
name = "Hypertext"
kind = "concept"
description = "Links as the unit of the web: addresses that can point at anything, the read-write web that was intended, and what a graph of documents can do that a tree cannot."
broader = ["open-web"]

[open-standards]
name = "Open standards"
kind = "concept"
description = "Protocols and formats agreed in the open and free to implement: HTTP, HTML, TCP/IP, RSS, and the consortia and working groups that keep them so."
broader = ["open-web"]

[decentralisation]
name = "Decentralisation"
kind = "concept"
description = "Many small nodes and no central operator: the web's original shape, and the alternative to platforms that own the users and the data."
broader = ["open-web", "distributed-systems"]

[open-data]
name = "Open data"
kind = "concept"
description = "Data published for anyone to use: government records, archives, and the five-star ladder from a file on the web to linked data with addresses."
broader = ["open-web", "policy"]

[training-data]
name = "Training data"
kind = "concept"
description = "What models learn from: web crawls, books, and licensed or unlicensed corpora; who holds what has not been scraped yet, and on what terms."
broader = ["machine-learning"]

[privacy]
name = "Privacy"
kind = "concept"
description = "Tracking, profiling, and consent on the web, and designs that avoid collecting the data in the first place."
broader = ["applied-security", "sovereignty"]

[data-sovereignty]
name = "Data sovereignty"
kind = "concept"
description = "Control over one's own data: pods, portability, and the right to choose the software and the agent that reads it; the personal counterpart of national sovereignty."
broader = ["sovereignty", "privacy"]

[attention-economy]
name = "Attention economy"
kind = "concept"
description = "Platforms that sell attention and optimise for engagement, what that does to the web and to discourse, and the intention economy proposed in its place."
broader = ["economics", "open-web"]

[philosophy-of-science]
name = "Philosophy of science"
kind = "concept"
description = "How science produces knowledge, what counts as evidence, and where its methods and claims reach their limits."
broader = ["philosophy", "history-of-science"]

[ethics]
name = "Ethics"
kind = "concept"
description = "Right and wrong under pressure: guilt and freedom in novels, the responsibility of scientists, and what we owe the systems we build and the people they affect."
broader = ["philosophy"]

[religion]
name = "Religion"
kind = "concept"
description = "Faith, doubt, and the institutions and cities built around belief, as history and as argument."
broader = ["philosophy", "history"]

[maximalist-novels]
name = "Maximalist novels"
kind = "concept"
description = "Very long, encyclopedic novels that try to hold a whole world: Infinite Jest, The Books of Jacob, and the studies of the form."
broader = ["literature"]

[intelligence]
name = "Intelligence"
kind = "concept"
description = "What intelligence is and how it arises, in brains, in neuron cultures, and in machines that learn."
broader = ["machine-learning", "neuroscience"]

[risk]
name = "Risk"
kind = "concept"
description = "Uncertainty, fragility, and systems that fail in ways nobody planned for, from markets to theme parks to production."
broader = ["reliability", "economics"]

[existential-risk]
name = "Existential risk"
kind = "concept"
description = "Technologies that could end or permanently cripple civilisation, from nuclear weapons to misaligned AI, and how people have tried to contain them."
broader = ["risk", "policy"]

[ai-alignment]
name = "AI alignment"
kind = "concept"
description = "Making AI systems pursue what their builders and users actually intend, and what happens when they do not."
broader = ["machine-learning", "existential-risk"]

[legibility]
name = "Legibility"
kind = "concept"
description = "Making a complex system readable from above: what the measure captures, what it erases, and what breaks when the map replaces the territory."
broader = ["complex-systems", "metrics", "observability"]

[research-labs]
name = "Research labs"
kind = "concept"
description = "The institutions where discovery happens and how they are funded and run: CERN, Bell Labs, ARPA, Los Alamos, DeepMind, and the labs behind modern medicine."
broader = ["history-of-science", "history-of-technology"]

[medicine]
name = "Medicine"
kind = "concept"
description = "How treatments are discovered, tested, and brought to patients, from antisepsis and sulfa drugs to modern drug design."
broader = ["life-sciences"]

[compilers]
name = "Compilers"
kind = "concept"
description = "Turning programs into other programs: parsers, interpreters, type checkers, and code generation."
broader = ["programming-languages"]

[networking]
name = "Networking"
kind = "concept"
description = "How machines talk: packets, protocols, sockets, and the networks from ARPANET to the web that carry them."
broader = ["distributed-systems", "open-web"]

[geopolitics]
name = "Geopolitics"
kind = "concept"
description = "How geography, empires, and arms shape the balance of power between states and regions, as history."
broader = ["history", "geography"]

[social-reform]
name = "Social reform"
kind = "concept"
description = "Plans to redesign society or the economy, from nineteenth-century utopias to high-modernist states and basic income, and what happened when they met people."
broader = ["economics", "policy"]

[world-history]
name = "World history"
kind = "concept"
description = "History told at the scale of continents and millennia: why societies diverged, and how the world came to look the way it does."
broader = ["history", "geography"]

[emergence]
name = "Emergence"
kind = "concept"
description = "Order nobody designed: reefs, the early web, neuron cultures, and simulated worlds where simple rules add up to behaviour no single part has."
broader = ["complex-systems"]

[high-modernism]
name = "High modernism"
kind = "concept"
description = "The confidence that society can be planned from above by experts: Le Corbusier's rational city, scientific forestry, and the schemes that failed when they met real life."
broader = ["legibility", "social-reform"]

[hubris]
name = "Hubris"
kind = "concept"
description = "When builders overestimate their control: an island of cloned dinosaurs, cities planned on paper, the bomb, and systems more capable than their makers understand."
broader = ["risk", "ethics"]

[commons]
name = "The commons"
kind = "concept"
description = "Resources held in common and the rules that keep them so: common land, open protocols, open data, and the web before the platforms."
broader = ["open-web", "economics"]

[intellectual-property]
name = "Intellectual property"
kind = "concept"
description = "Patents, copyright, and licences: who owns an invention or a text, from the web given to the public domain to books scraped for training data."
broader = ["policy", "economics"]

[provenance]
name = "Provenance"
kind = "concept"
description = "Where something came from and who vouches for it: signed media, rights-clear training data, and artifacts that carry their own history."
broader = ["training-data", "applied-security"]

[external-memory]
name = "External memory"
kind = "concept"
description = "Notes, links, and stores that remember for us: second brains, the web as a shared memory, and what agents write down for their next session."
broader = ["knowledge-management", "context-engineering"]

[augmentation]
name = "Augmentation"
kind = "concept"
description = "Computers that extend what people can do instead of replacing them: Licklider's symbiosis, Kasparov's centaur chess, and working alongside coding agents."
broader = ["ai-engineering", "intelligence"]

[technology-races]
name = "Technology races"
kind = "concept"
description = "Powers racing to build a technology first, from the bomb and its deterrence to frontier AI and the data it needs."
broader = ["geopolitics", "existential-risk"]

[scientific-revolutions]
name = "Scientific revolutions"
kind = "concept"
description = "Moments when a field's picture of the world changes: the invention of modern science, molecular biology, antisepsis, and the first antibiotics."
broader = ["philosophy-of-science", "history-of-science"]

[cities]
name = "Cities"
kind = "concept"
description = "How cities are planned and how they actually grow: Jerusalem over three thousand years, Brasilia drawn on paper, and the rational city the web was designed against."
broader = ["geography"]

[languages]
name = "Languages and translation"
kind = "concept"
description = "Human languages and moving meaning between them: translated novels, learning to read Chinese, Japanese, and Hebrew, and Europe's multilingual text."
broader = ["literature"]

[europe]
name = "Europe"
kind = "concept"
description = "Europe's place in technology and history: where the web was invented, what it builds and gives away, and the data and capabilities it still holds."
broader = ["sovereignty", "geography"]

[switzerland]
name = "Switzerland"
kind = "concept"
description = "The country this site is written from: CERN in Geneva, Basel, Swiss innovation as measured and as lived, and Swiss civic projects."
broader = ["europe"]

[democratisation]
name = "Democratisation"
kind = "concept"
description = "A capability that needed money, a team, or years of training becoming available to anyone: printing, the web, and now building software by describing it."
broader = ["augmentation", "commons"]

[future-of-work]
name = "Future of work"
kind = "concept"
description = "What AI does to jobs and livelihoods: the interval before any post-scarcity economy, basic income against basic access, and who gets through the middle."
broader = ["economics", "social-reform"]

[entrepreneurship]
name = "Entrepreneurship"
kind = "concept"
description = "Finding something worth building and building it: ventures, side projects, and what changes when anyone can spot an opportunity and operate a business with AI."
broader = ["economics"]

# Technologies -------------------------------------------------------------

[webassembly]
name = "WebAssembly"
kind = "technology"
description = "Portable, sandboxed bytecode for running native-speed code in the browser and beyond."
broader = ["open-web"]

[rust]
name = "Rust"
kind = "technology"
description = "The systems language most of the projects here are written in."
broader = ["programming-languages"]

[haskell]
name = "Haskell"
kind = "technology"
description = "The language that shaped how I think about types, effects, and correctness."
broader = ["programming-languages"]

[opentelemetry]
name = "OpenTelemetry"
kind = "technology"
description = "The vendor-neutral standard for traces, metrics, and logs, including the GenAI semantic conventions for model calls."
broader = ["observability"]

[typescript]
name = "TypeScript"
kind = "technology"
description = "TypeScript on Bun, the language of the Agent Platform Handbook code."
broader = ["programming-languages"]

[elixir]
name = "Elixir"
kind = "technology"
description = "Elixir, Phoenix, and the BEAM for the long-running, fault-tolerant parts."
broader = ["programming-languages"]

[pingora]
name = "Pingora"
kind = "technology"
description = "Cloudflare's Rust framework for building proxies, the base of Zentinel."
broader = ["edge-systems", "rust"]

[kubernetes]
name = "Kubernetes"
kind = "technology"
description = "Container orchestration, and the question of when you actually need it."
broader = ["platform-automation"]

[gpus]
name = "GPUs"
kind = "technology"
description = "GPUs as the computer: memory shape, partitioning, and the hardware under inference."
broader = ["inference"]

[linux]
name = "Linux"
kind = "technology"
description = "Linux distributions and system administration, Void Linux in particular."
broader = ["operating-systems"]

[openbsd]
name = "OpenBSD"
kind = "technology"
description = "OpenBSD and the BSD approach to correctness and simplicity."
broader = ["operating-systems"]

[zola]
name = "Zola"
kind = "technology"
description = "The static site generator this site and several project sites are built with."
broader = ["open-web"]

# This site ----------------------------------------------------------------

[meta]
name = "This site"
kind = "site"
description = "Posts about raskell.io itself: why it exists, how it is built, and where it is going."
