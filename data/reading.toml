# The reading log of raskell.io: books, papers, reports, and long articles, read, being read, or next.
# It drives /reading/, the reading nodes on /map/, and the "Review of" line on reviews.
#
#   id        slug, unique; the anchor on /reading/ (#id) and the map node (w:id)
#   title     the work's title; subtitle optional
#   author    as printed; several authors in one string
#   kind      book, novel, paper, report, article, essay, or journal
#   year      first published (optional); edition, publisher optional
#   isbn      the edition I read; picks its cover (`mise run reading-covers`), optional;
#             cover_id (an Open Library cover id) when the ISBN finds the wrong one, "none" for no cover
#   cover     path under static/, written by `mise run reading-covers`; without it the page shows a tile
#   url       the publisher's or author's page, or the paper itself
#   status    reading (now), next (right after what I am reading), backlog (some day, in no order),
#             read, or set-aside
#   started   the month I started (reading), finished the month I finished (read, set-aside), as
#             "YYYY-MM", shown as "October 2026", or "YYYY" when only the year is known;
#             read entries need finished
#   topics    tag slugs from data/tags.toml (checked by `mise run tags-check`)
#   take      one sentence: what it is about for me, or what I made of it
#   rating    1 to 10, set when there is a review; shown with the review and on the row
#   suggested_by, suggested_url, suggested_note
#             credit for a reader who suggested the work: name, a link to them, and why (optional)
#
# A review is an article (or a note) with `review = "<id>"` under [extra]; `mise run review <id>` starts
# one. Pages that discuss a work without reviewing it list it in `reads = ["<id>"]`. Both draw the page
# into the work's neighbourhood on the map. Order inside a status is the order on the page (next: the
# queue, top first; read: newest finished first, whatever the order here).

